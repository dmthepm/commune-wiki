name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Full history, not the default depth of 1. `tests/install.test.mjs` and
      # the stranger-install step below both fetch this workspace as a git
      # dependency, and on a pull request the checked-out commit is a synthetic
      # merge commit that exists nowhere else — a shallow clone of it is not
      # something another repository can reliably fetch from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # Reads .nvmrc, so CI and a local checkout cannot drift apart. 22 is a
      # *development* floor, not the package's: the bin now runs compiled
      # JavaScript, so a consumer only needs Astro's own 22.12 (`engines`).
      # What still needs 22.18 is this repo's own tests and `astro.config.mjs`,
      # which import `src/**/*.ts` directly and rely on Node stripping types by
      # default — first released in 22.18.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The type gate. Node strips types when it runs these files and never
      # checks them, and `astro check` never sees them either — so without this
      # step a type error in the graph core, the CLI or the plugins reaches a
      # consumer as a failed `prepare` on their install. It runs before the
      # tests because a compile error is cheaper to read than a test failure
      # caused by one.
      - run: pnpm build:lib

      - run: pnpm test

      # The stranger's *project*. `pnpm test` already runs
      # `tests/consumer.test.mjs`, which is this plus the assertions, so this
      # step buys no coverage — it is the named entry point the plan asked for,
      # and the one to delete first if CI time ever matters.
      - run: pnpm test:consumer

      # What actually ships. Not an assertion — a listing, so the `files` set is
      # readable in the log of the run that produced a tag, and a file that
      # started or stopped being packed is visible in the diff between two runs
      # rather than after an install fails.
      #
      # `--json --out` rather than `--dry-run`: pnpm 10.19 has no `--dry-run`
      # (`ERROR  Unknown option: 'dry-run'`), and the tarball is written to a
      # temp directory so nothing is left in the workspace for the later
      # `git diff` steps to trip over.
      - name: list what the package would ship
        run: |
          set -euo pipefail
          pnpm pack --json --out "$(mktemp -d)/pkg.tgz" \
            | sed -n '/^{/,$p' \
            | node -e 'const c=require("node:fs").readFileSync(0,"utf8");for(const f of JSON.parse(c).files)console.log(f.path);'

      # The stranger test. Everything above runs from a checkout, where `lib/`
      # is on disk because someone built it; none of it can see the two ways an
      # install differs — `prepare` has to build `lib/`, and `files` has to pack
      # it. A `git+file://` install takes the same path a `github:` user takes,
      # including both. The `ls` is the assertion that matters: `commune --help`
      # alone would also pass if pnpm had silently installed nothing.
      # It installs from a bare clone rather than from the workspace directly,
      # for the reason `tests/install.test.mjs` explains at length: on a pull
      # request the workspace is detached on a merge commit with no branch
      # pointing at it. `-x` so a failure names the command that failed instead
      # of an exit code on its own.
      - name: install from a git ref, the way a stranger would
        run: |
          set -euxo pipefail
          tmp=$(mktemp -d)
          git clone --bare "$GITHUB_WORKSPACE" "$tmp/bare.git"
          git -C "$tmp/bare.git" update-ref refs/heads/ci-install "$GITHUB_SHA"
          name=$(node -p "require('$GITHUB_WORKSPACE/package.json').name")
          spec="git+file://$tmp/bare.git#$GITHUB_SHA"
          mkdir "$tmp/consumer" && cd "$tmp/consumer"
          # pnpm 10 will not run a git dependency's `prepare` unless the
          # consumer allowlists the package, and `prepare` is what compiles
          # `lib/`. Written here rather than assumed, because it is what a real
          # consumer has to write — see README, "Installing from git".
          #
          # The spelling of that entry is not settled across pnpm 10, and this
          # step pinning one is what `tests/install.test.mjs` already refuses to
          # do. Measured there:
          #
          #   10.34.5  `name@spec` works; a bare name is silently not a match
          #            for a git dependency and the install is refused.
          #   10.19.0  a bare name works; `name@spec` is rejected outright with
          #            `ERR_PNPM_INVALID_VERSION_UNION` ("Use exact versions
          #            only").
          #
          # `pnpm/action-setup` resolves `version: 10` to whatever the latest
          # 10.x is on the day the job runs, so which side of that line CI is on
          # is not ours to choose. Try the current spelling, fall back on that
          # one error, and let every other failure through.
          allow() {
            node -e 'require("fs").writeFileSync("package.json", JSON.stringify({
              name: "ci-install-consumer", version: "0.0.0", private: true,
              pnpm: { onlyBuiltDependencies: [process.argv[1]] },
            }, null, 2) + "\n");' "$1"
          }
          allow "$name@$spec"
          if ! pnpm add "$spec" 2>&1 | tee "$tmp/add.log"; then
            # Only that one error is a spelling problem. A fetch failure, a
            # refused `prepare` or a type error is the thing this step exists to
            # catch, and retrying it would only bury it.
            grep -q ERR_PNPM_INVALID_VERSION_UNION "$tmp/add.log" || exit 1
            # `allow` rewrites the whole file, so the half-written
            # `dependencies` entry from the failed attempt goes with it.
            allow "$name"
            pnpm add "$spec"
          fi
          ./node_modules/.bin/commune --help
          ls "node_modules/$name/lib/cli/main.js"

      - run: pnpm build

      # The bin has to work from a clean checkout, not just from a warm
      # worktree. Output is discarded: this asserts exit 0, and exit 0 means
      # "check finished", not "the content is clean".
      - run: node bin/commune.mjs check --json > /dev/null

      # The refactor's invariant, enforced on every PR rather than remembered:
      # backlinks.json is committed and a build must not change it.
      - run: git diff --exit-code public/backlinks.json
